# Publishes the agentic-id CLI to npm, at the version in package.json, in either of two ways:
#   - push a tag v<version>, for example v0.6.0, or
#   - Actions > Publish CLI to npm > Run workflow, with "Publish to npm" ticked.
# Run it with the box unticked to check and pack only. Needs one repository secret, NPM_TOKEN: a
# granular npm token with read and write access to packages. Nothing runs on pull requests or plain pushes.
name: Publish CLI to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm (leave unticked to check and pack only)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # lets npm record where the package was built (provenance) once the repo is public

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Tag matches the version in package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($want). Bump the version first."
            exit 1
          fi

      - name: Version is not on npm yet
        run: |
          v="$(node -p "require('./package.json').version")"
          if npm view "agentic-id@$v" version >/dev/null 2>&1; then
            echo "agentic-id@$v is already on npm. Bump the version in package.json, plugin.json, marketplace.json and CLIENT first."
            exit 1
          fi
          echo "Will publish agentic-id@$v"

      - name: Tests (no network, no credits)
        run: bash test/validate.sh

      - name: Install the packed CLI and run it
        run: |
          npm pack
          npm install -g ./agentic-id-*.tgz
          agentic-id --version
          agentic-id --help > /dev/null
          agentic-id estimate find hubspot.com --role "VP Marketing" --limit 5

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "The NPM_TOKEN repository secret is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          flags="--access public"
          # npm can record provenance only for a public repository.
          if [ "${{ github.event.repository.private }}" = "false" ]; then flags="$flags --provenance"; fi
          npm publish $flags
