<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-labelledby="t d" xml:space="preserve">
  <title id="t">How Agentic ID resolution works: a data co-operative feeding a verified identity ledger</title>
  <desc id="d">Workspaces that contribute send hashed identity keys into a shared identity ledger. A workspace that does not contribute keeps its keys private to itself. The ledger holds more than 75 million verified companies and people. An agent's resolve request comes back as a stable identity with its evidence, and every ID issued is recorded.</desc>
  <rect width="820" height="340" rx="12" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="819" height="339" rx="12" fill="none" stroke="#30363d"/>
  <text x="24" y="40" fill="#8b949e" font-size="12">DATA CO-OPERATIVE</text>
  <text x="290" y="40" fill="#8b949e" font-size="12">VERIFIED IDENTITY LEDGER</text>
  <text x="612" y="40" fill="#8b949e" font-size="12">YOUR AGENT</text>

  <path d="M196,92 C246,92 240,120 290,120" fill="none" stroke="#58a6ff" stroke-opacity="0.35" stroke-width="2" />
    <circle r="5" fill="#58a6ff" opacity="0">
      <animateMotion dur="3s" begin="0s" repeatCount="indefinite" path="M196,92 C246,92 240,120 290,120"/>
      <animate attributeName="opacity" dur="3s" begin="0s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.1;0.85;1"/>
    </circle>
    <rect x="24" y="70" width="172" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="40" y="89" fill="#e6edf3" font-size="13" font-weight="600">Quantaflow Labs</text>
    <text x="40" y="105" fill="#58a6ff" font-size="11">contributes</text>
  <path d="M196,172 C246,172 240,170 290,170" fill="none" stroke="#58a6ff" stroke-opacity="0.35" stroke-width="2" />
    <circle r="5" fill="#58a6ff" opacity="0">
      <animateMotion dur="3s" begin="0.7s" repeatCount="indefinite" path="M196,172 C246,172 240,170 290,170"/>
      <animate attributeName="opacity" dur="3s" begin="0.7s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.1;0.85;1"/>
    </circle>
    <rect x="24" y="150" width="172" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="40" y="169" fill="#e6edf3" font-size="13" font-weight="600">Harborline Cloud</text>
    <text x="40" y="185" fill="#58a6ff" font-size="11">contributes</text>
  <path d="M196,252 C236,252 250,220 290,220" fill="none" stroke="#8b949e" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 5"/>
    <circle r="5" fill="#8b949e" opacity="0">
      <animateMotion dur="3s" begin="1.4s" repeatCount="indefinite" path="M196,252 C236,252 250,220 290,220"/>
      <animate attributeName="opacity" dur="3s" begin="1.4s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.1;0.85;1"/>
    </circle>
    <rect x="24" y="230" width="172" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="40" y="249" fill="#e6edf3" font-size="13" font-weight="600">Meridian RevOps</text>
    <text x="40" y="265" fill="#8b949e" font-size="11">keeps its keys private</text>

  <rect x="290" y="70" width="260" height="200" rx="12" fill="#161b22" stroke="#d29922" stroke-opacity="0.7">
    <animate attributeName="stroke-opacity" dur="3s" repeatCount="indefinite" values="0.4;0.9;0.4"/>
  </rect>
  <text x="420" y="110" text-anchor="middle" fill="#d29922" font-size="30" font-weight="700">75M+</text>
  <text x="420" y="132" text-anchor="middle" fill="#e6edf3" font-size="12">companies and people</text>
  <g font-size="11" fill="#8b949e">
    <text x="310" y="170">· one stable ID per entity</text>
    <text x="310" y="190">· links need evidence</text>
    <text x="310" y="210">· conflicts flagged, never merged</text>
    <text x="310" y="230">· every ID issued is recorded</text>
    <text x="310" y="250">· matched on hashed keys</text>
  </g>

  <path d="M550,170 C590,170 572,170 612,170" fill="none" stroke="#3fb950" stroke-opacity="0.4" stroke-width="2"/>
  <circle r="5" fill="#3fb950" opacity="0">
      <animateMotion dur="3s" begin="1.2s" repeatCount="indefinite" path="M550,170 C590,170 572,170 612,170"/>
      <animate attributeName="opacity" dur="3s" begin="1.2s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.1;0.85;1"/>
    </circle>
  <rect x="612" y="120" width="184" height="100" rx="8" fill="#161b22" stroke="#3fb950" stroke-opacity="0.6"/>
  <text x="628" y="148" fill="#e6edf3" font-size="13" font-weight="600">resolve(email)</text>
  <text x="628" y="172" fill="#3fb950" font-size="12">→ stable ID</text>
  <text x="628" y="192" fill="#8b949e" font-size="11">+ evidence, confidence</text>
  <text x="628" y="209" fill="#8b949e" font-size="11">+ what it cost</text>

  <text x="24" y="318" fill="#8b949e" font-size="11">Contributing workspaces strengthen the shared ledger. A workspace's own facts and outcomes never leave it.</text>
</svg>
