<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" role="img" aria-labelledby="t d" xml:space="preserve">
  <title id="t">An agent resolves a work email to an Agentic ID identity</title>
  <desc id="d">The agent calls agentic_id_resolve. Agentic ID normalises the email, turns it into a hashed match key, searches its verified ledger of more than 75 million companies and people, finds a known match on the work email with confidence 0.97 and no conflict, and returns a stable identity for Maya Chen, VP Marketing at Tallpine Software. The lookup is free and the issued ID is recorded in the ledger.</desc>
  <defs>
    <clipPath id="typing"><rect x="54" y="52" height="24" width="0">
      <animate attributeName="width" dur="15s" repeatCount="indefinite" values="0;0;330.59999999999997;330.59999999999997" keyTimes="0;0.0200;0.1267;1" calcMode="linear"/>
    </rect></clipPath>
    <linearGradient id="scan" x1="0" x2="1"><stop offset="0" stop-color="#58a6ff" stop-opacity="0"/><stop offset="0.5" stop-color="#58a6ff"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="820" height="420" rx="12" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="819" height="419" rx="12" fill="none" stroke="#30363d"/>
  <circle cx="22" cy="20" r="5" fill="#ff5f57"/><circle cx="40" cy="20" r="5" fill="#febc2e"/><circle cx="58" cy="20" r="5" fill="#28c840"/>
  <text x="410" y="24" text-anchor="middle" fill="#8b949e" font-size="12">your coding agent · agentic-id</text>
  <line x1="0" y1="38" x2="820" y2="38" stroke="#30363d"/>

  <text x="36" y="70" fill="#3fb950" font-weight="600">&gt;</text>
  <text x="54" y="70" fill="#e6edf3" clip-path="url(#typing)">Who is maya.chen@tallpinesoftware.com?</text>

  <text x="36" y="104" opacity="0"><tspan fill="#bc8cff" font-weight="400">⏺ </tspan><tspan fill="#bc8cff" font-weight="600">agentic_id_resolve</tspan><tspan fill="#8b949e" font-weight="400">({ identifiers: { email: "maya.chen@tallpinesoftware.com" } })</tspan><animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="linear"
    values="0;0;1;1;0;0" keyTimes="0;0.1600;0.1767;0.9067;0.9400;1"/></text>
  <text x="36" y="138" opacity="0"><tspan fill="#8b949e" font-weight="400">  normalise </tspan><tspan fill="#e6edf3" font-weight="400">maya.chen@tallpinesoftware.com</tspan><animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="linear"
    values="0;0;1;1;0;0" keyTimes="0;0.2133;0.2300;0.9067;0.9400;1"/></text>
  <text x="36" y="164" opacity="0"><tspan fill="#8b949e" font-weight="400">  anchor    </tspan><tspan fill="#58a6ff" font-weight="400">work_email</tspan><tspan fill="#8b949e" font-weight="400"> → hashed match key</tspan><animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="linear"
    values="0;0;1;1;0;0" keyTimes="0;0.2600;0.2767;0.9067;0.9400;1"/></text>
  <text x="36" y="190" opacity="0"><tspan fill="#8b949e" font-weight="400">  ledger    </tspan><tspan fill="#e6edf3" font-weight="400">searching 75M+ verified companies and people</tspan><animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="linear"
    values="0;0;1;1;0;0" keyTimes="0;0.3067;0.3233;0.9067;0.9400;1"/></text>
  <text x="36" y="222" opacity="0"><tspan fill="#8b949e" font-weight="400">  match     </tspan><tspan fill="#3fb950" font-weight="600">known</tspan><tspan fill="#e6edf3" font-weight="400"> · matched on work_email · confidence 0.97</tspan><animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="linear"
    values="0;0;1;1;0;0" keyTimes="0;0.4267;0.4433;0.9067;0.9400;1"/></text>
  <text x="36" y="248" opacity="0"><tspan fill="#8b949e" font-weight="400">  conflict  </tspan><tspan fill="#e6edf3" font-weight="400">none</tspan><tspan fill="#8b949e" font-weight="400">  (two records would be flagged, never merged)</tspan><animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="linear"
    values="0;0;1;1;0;0" keyTimes="0;0.4733;0.4900;0.9067;0.9400;1"/></text>

  <g opacity="0">
    <rect x="128" y="220" width="300" height="3" rx="1.5" fill="#30363d"/>
    <rect x="128" y="220" width="70" height="3" rx="1.5" fill="url(#scan)">
      <animate attributeName="x" dur="15s" repeatCount="indefinite" values="128;128;358;358" keyTimes="0;0.3133;0.4200;1"/>
    </rect>
    <animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="linear"
    values="0;0;1;1;0;0" keyTimes="0;0.3067;0.3233;0.4333;0.4667;1"/>
  </g>

  <g opacity="0">
    <rect x="36" y="268" width="748" height="108" rx="8" fill="#161b22" stroke="#3fb950" stroke-opacity="0.6"/>
    <text x="52" y="294"><tspan fill="#3fb950" font-weight="600">✓ Maya Chen</tspan><tspan fill="#e6edf3"> · VP Marketing · Tallpine Software</tspan></text>
    <text x="52" y="318"><tspan fill="#8b949e">id     </tspan><tspan fill="#e6edf3">did:icustomer:global:person:7a1e0c9f3b</tspan><tspan fill="#8b949e">  (stable)</tspan></text>
    <text x="52" y="340"><tspan fill="#8b949e">found  </tspan><tspan fill="#e6edf3">true</tspan><tspan fill="#8b949e">   ·   cost </tspan><tspan fill="#e6edf3">0 credits</tspan><tspan fill="#8b949e">   ·   ledger </tspan><tspan fill="#d29922">issued ✓</tspan></text>
    <text x="52" y="364" fill="#8b949e" font-size="12">Weak evidence comes back as needs_evidence. Nothing is guessed.</text>
    <animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="linear"
    values="0;0;1;1;0;0" keyTimes="0;0.5333;0.5500;0.9067;0.9400;1"/>
  </g>
</svg>
